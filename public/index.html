<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="/manifest.json">

<style>
:root{
  --night:#1B2730; --deck:#24333E; --deck2:#2C3E4A; --edge:#3A4F5D;
  --amber:#E8A33D; --moon:#DCE4EA; --dust:#93A7B4; --signal:#C4553F; --paper:#EDE6D4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#121A21}
body{
  margin:0;height:100%;background:#121A21;color:var(--moon);

  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 50% -10%, #2A3D4A 0%, #121A21 62%);
}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 18px 140px;min-height:100%}
h1,h2,.display{font-family:"Zen Antique",serif;font-weight:400;letter-spacing:.02em}
h1{font-size:30px;margin:26px 0 4px;line-height:1.35}
h2{font-size:20px;margin:28px 0 10px}
p{margin:.6em 0}
.sub{color:var(--dust);font-size:13.5px;line-height:1.6}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 0 6px;min-height:52px}

.topbar .spacer{flex:1}
.code{font-size:12px;color:var(--dust);letter-spacing:.14em}

.card{background:var(--deck);border:1px solid var(--edge);border-radius:14px;padding:16px;margin:12px 0}
.card.flat{background:transparent}
.row{display:flex;align-items:center;gap:12px}

button{font-family:inherit}
.btn{display:block;width:100%;padding:16px;border-radius:12px;border:1px solid var(--edge);
  background:var(--deck2);color:var(--moon);font-size:16.5px;font-weight:500;cursor:pointer;margin:10px 0}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);color:#1B2730;border-color:var(--amber);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--signal);color:#E28B78}

.btn.sm{padding:11px;font-size:14.5px;margin:6px 0}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

input,textarea{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--edge);
  background:#1A252E;color:var(--moon);font-size:16px;font-family:inherit}
textarea{min-height:110px;resize:vertical;line-height:1.6}
label{display:block;font-size:13px;color:var(--dust);margin:14px 0 6px}

.mission{background:#2A1B1E;border:1px solid #6B3A3A;border-radius:14px;padding:16px;margin:14px 0;

  border-bottom:1px dashed #6B3A3A;padding-bottom:8px;margin-bottom:10px;display:flex;justify-content:space-between}
.mission .txt{font-size:17px;line-height:1.7;color:#F3E3DE}
.mission .done{color:#E28B78;font-family:"Zen Antique",serif;font-size:14px;margin-top:8px}
.mission .reward{background:#1E2A33;border:1px solid var(--edge);border-radius:10px;padding:12px 14px;margin-top:12px}

/* ミッション紙片 — このアプリで唯一の明るい面 */
.slip{background:var(--paper);color:#2A2419;border-radius:6px;padding:16px 16px 14px;margin:12px 0;
  box-shadow:0 10px 24px rgba(0,0,0,.35);position:relative}
.slip .stamp{font-family:"Zen Antique",serif;font-size:12.5px;color:#8A6A2E;border-bottom:1px solid #C9BC9C;
  padding-bottom:7px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.slip .body{font-size:17px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.slip.unread::after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 0 3px #121A21}
.slip.dim{opacity:.55}

.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;border:1px solid var(--edge);color:var(--dust)}
.pill.wolf{border-color:#7C8FA0;color:#C8D2DA}
.pill.amber{border-color:var(--amber);color:var(--amber)}

.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:12px;
  border:1px solid var(--edge);background:var(--deck);color:var(--moon);font-size:16px;margin:8px 0;cursor:pointer}
.pick[aria-pressed="true"]{border-color:var(--amber);background:#33414B;box-shadow:inset 3px 0 0 var(--amber)}
.pick .mark{width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);flex:none}
.pick[aria-pressed="true"] .mark{background:var(--amber);border-color:var(--amber)}
.pick:disabled{opacity:.4}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(180deg,rgba(18,26,33,0) 0%,#121A21 34%);
  padding:22px 18px calc(16px + env(safe-area-inset-bottom,0px));}
.dock .inner{max-width:560px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;padding:11px 4px;border-radius:10px;border:1px solid var(--edge);background:#1E2A33;
  color:var(--dust);font-size:12.5px;cursor:pointer;position:relative}
.tabs button[aria-current="true"]{color:var(--moon);border-color:#5A7183;background:var(--deck2)}
.dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--amber)}

.logitem{border-left:2px solid var(--edge);padding:2px 0 14px 14px;margin-left:4px}
.logitem .meta{font-size:12px;color:var(--dust)}
.logitem .txt{white-space:pre-wrap;word-break:break-word}

.tl{display:flex;gap:12px;padding:10px 0;border-top:1px solid #31434F}
.tl .t{font-variant-numeric:tabular-nums;color:var(--amber);font-size:13.5px;flex:none;width:52px;padding-top:2px}
.tl .c{flex:1;min-width:0}
.tl .to{font-size:13px;color:var(--dust)}
.tl .m{white-space:pre-wrap;word-break:break-word}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));
  background:var(--paper);color:#2A2419;padding:11px 18px;border-radius:999px;font-size:14px;z-index:20;
  box-shadow:0 8px 20px rgba(0,0,0,.4);max-width:88%}
.hide{display:none!important}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid #31434F;margin:20px 0}
.switcher{position:sticky;top:0;z-index:6;margin:0 -18px;padding:8px 18px;background:#0E151B;
  border-bottom:1px solid var(--edge);display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dust)}
.switcher select{flex:1;background:#1A252E;color:var(--moon);border:1px solid var(--edge);border-radius:8px;padding:7px 8px;font-size:14px;font-family:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   指示人狼 — プロトタイプ
   1ファイルで動作。以下の2モードを自動判別します。
     server : /api/ping が応答する（Node サーバーで配信）→ 7台の実機で同時プレイ
     local  : それ以外（単体で開いた場合）→ 1台で全員を切り替えるテストモード
   ============================================================ */

const MAX_DELAY_MS = 5 * 60 * 1000;      // 指示の最大遅延 5分
const MAX_LOG_DELAY_MS = 3 * 60 * 1000;  // 旅行ログの反映遅延 最大3分
const POLL_MS = 4000;
const PLAYER_COUNT = 7, WOLF_COUNT = 2;

/* 市民側にも自然に届く「旅行ログ指示」。ここに追加・編集するだけで内容を増やせます。
   人狼からの指示と、見た目・届き方はまったく同じにしてあります。 */
const LOG_PROMPTS = [
  { id:"photo_here",   kind:"photo",       text:"今いる場所の写真を1枚撮影して、旅行ログに記録せよ" },
  { id:"photo_duo",    kind:"photo",       text:"一番近くにいる人とツーショットを撮影して、旅行ログに記録せよ" },
  { id:"photo_group",  kind:"photo",       text:"全員が写っている写真を1枚撮影して、旅行ログに記録せよ" },
  { id:"tanka",        kind:"tanka",       text:"今の感情を短歌にして、旅行ログに記録せよ" },
  { id:"photo_request",kind:"photo",       text:"誰か1人に写真を撮ってもらい、旅行ログに記録せよ" },
  { id:"mood",         kind:"mood",        text:"今の気分を5段階で評価して、旅行ログに記録せよ" },
  { id:"poem",         kind:"poem",        text:"ポエムを書いて、旅行ログに記録せよ" },
  { id:"wolf_theory",  kind:"wolf_theory", text:"今の人狼の推理を書いて、旅行ログに記録せよ" }
];
const AMBIENT_INTERVAL = ()=> rnd(20,40)*60*1000;   // 20〜40分おき

/* 秘密ミッション。旅行全体で3つだけ、別々のプレイヤーにランダムで届く。 */
const SECRET_MISSIONS = [
  "みんなへの感謝をラップでまとめて披露しろ（AIを使って作成してもOK）",
  "一発ギャグを10回成功させろ",
  "誰かに「お前今日どうした？」と言わせろ"
];
function assignSecretMissions(g){
  const shuffledPlayers = g.players.map(p=>p.id);
  for(let i=shuffledPlayers.length-1;i>0;i--){const j=rnd(0,i);[shuffledPlayers[i],shuffledPlayers[j]]=[shuffledPlayers[j],shuffledPlayers[i]];}
  const pool = SECRET_MISSIONS.slice();
  for(let i=pool.length-1;i>0;i--){const j=rnd(0,i);[pool[i],pool[j]]=[pool[j],pool[i]];}
  const chosen = shuffledPlayers.slice(0, Math.min(3, pool.length, g.players.length));
  let t = g.createdAt;
  return chosen.map((toId,i)=>{
    t = t + (i===0 ? rnd(30,90)*60*1000 : rnd(180,240)*60*1000);   // 1個目は30〜90分後、以降は3〜4時間おき
    return {id:uid(), toId, text:pool[i], deliverAt:t, pushed:false, completed:false, rewardPlayerId:null, rewardRole:null};
  });
}
const rnd = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const uid = ()=>Math.random().toString(36).slice(2,10);
const nowMs = ()=>Date.now();
const hhmm = t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===================== ゲームロジック（サーバーと共有の考え方） ===================== */
const Core = {
  newGame(name, playerNames){
    const roles = Array(PLAYER_COUNT).fill("citizen");
    const idx = [...Array(PLAYER_COUNT).keys()];
    for(let i=idx.length-1;i>0;i--){const j=rnd(0,i);[idx[i],idx[j]]=[idx[j],idx[i]];}
    idx.slice(0,WOLF_COUNT).forEach(i=>roles[i]="wolf");
    const t = nowMs();
    const g = {
      code: String(rnd(100000,999999)),
      name: name || "旅行",
      createdAt: t,
      phase: "playing",                       // playing | voting | result
      players: playerNames.map((n,i)=>({
        id:"p"+(i+1), name:n.trim()||("プレイヤー"+(i+1)), role:roles[i],
        claimed:false, seenRole:false, nextAmbient: t + AMBIENT_INTERVAL()
      })),
      orders: [],     // {id,fromId,toId,text,sentAt,deliverAt,read}
      ambient: [],    // {id,toId,text,deliverAt,read}
      logs: [],       // {id,playerId,text,at}
      votes: {},      // playerId -> [id,id]
      revealedAt: null,
      secretMissions: []
    };
    g.secretMissions = assignSecretMissions(g);
    return g;
  },
  /* 各プレイヤーへ自然な通知を随時補充する。人狼にも届く。 */
  topUp(g){
    const t = nowMs();
    if(g.phase==="result") return;
    g.players.forEach(p=>{
      let guard=0;
      while(p.nextAmbient <= t && guard++ < 5){
        const pr = LOG_PROMPTS[rnd(0,LOG_PROMPTS.length-1)];
        g.ambient.push({id:uid(), toId:p.id, text:pr.text, kind:pr.kind, deliverAt:p.nextAmbient, read:false});
        p.nextAmbient = p.nextAmbient + AMBIENT_INTERVAL();
      }
    });
  },
  sendOrder(g, fromId, toId, text){
    const t = nowMs();
    const delay = Math.floor(Math.random()*(MAX_DELAY_MS+1));  // 0秒〜5分
    g.orders.push({id:uid(), fromId, toId, text:text.trim(), sentAt:t, deliverAt:t+delay, read:false});
  },
  /* 自分の端末に返してよい情報だけを抜き出す（差出人・他人の役職は絶対に含めない） */
  view(g, myId){
    this.topUp(g);
    const t = nowMs();
    const me = g.players.find(p=>p.id===myId) || null;
    const reveal = g.phase==="result";
    const inbox = [];
    if(me){
      g.orders.filter(o=>o.toId===myId && o.deliverAt<=t)
        .forEach(o=>inbox.push({id:o.id, kind:"order", text:o.text, at:o.deliverAt, read:o.read}));
      g.ambient.filter(a=>a.toId===myId && a.deliverAt<=t)
        .forEach(a=>inbox.push({id:a.id, kind:"ambient", promptKind:a.kind, text:a.text, at:a.deliverAt, read:a.read}));
      inbox.sort((a,b)=>b.at-a.at);
    }
    let secretMission = null;
    if(me){
      const sm = (g.secretMissions||[]).find(m=>m.toId===myId && m.deliverAt<=t);
      if(sm){
        let reward=null;
        if(sm.completed && sm.rewardPlayerId){
          const rp=g.players.find(p=>p.id===sm.rewardPlayerId);
          if(rp) reward={name:rp.name, role:rp.role};
        }
        secretMission = {id:sm.id, text:sm.text, completed:sm.completed, reward};
      }
    }
    return {
      code:g.code, name:g.name, phase:g.phase, createdAt:g.createdAt,
      players:g.players.map(p=>({id:p.id, name:p.name, claimed:p.claimed,
        role: (reveal||p.id===myId) ? p.role : null, voted: !!g.votes[p.id]})),
      me: me ? {id:me.id, name:me.name, role:me.role, seenRole:me.seenRole} : null,
      inbox,
      secretMission,
      sentCount: me && me.role==="wolf" ? g.orders.filter(o=>o.fromId===myId).length : 0,
      logs: g.logs.filter(l=>l.playerId===myId || l.deliverAt<=t).slice(-80),
      myVote: g.votes[myId] || null,
      votedCount: Object.keys(g.votes).length,
      reveal: reveal ? {
        orders: g.orders.slice().sort((a,b)=>a.deliverAt-b.deliverAt),
        ambientCount: g.ambient.filter(a=>a.deliverAt<=t).length,
        votes: g.votes
      } : null
    };
  }
};

/* ===================== バックエンド ===================== */
const LS = {
  get(k,d){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
};

const LocalBackend = {
  mode:"local",
  _g(code){ return LS.get("sjw:g:"+code,null); },
  _s(g){ LS.set("sjw:g:"+g.code,g); LS.set("sjw:last",g.code); },
  async create(name,names){ const g=Core.newGame(name,names); this._s(g); return {code:g.code}; },
  async exists(code){ return !!this._g(code); },
  async claim(code,pid){ const g=this._g(code); if(!g) return null; const p=g.players.find(x=>x.id===pid);
    if(!p) return null; p.claimed=true; this._s(g); return {token:pid}; },
  async state(code,pid){ const g=this._g(code); if(!g) return null; const v=Core.view(g,pid); this._s(g); return v; },
  async act(code,pid,action,payload){ const g=this._g(code); if(!g) return null; applyAction(g,pid,action,payload); this._s(g); return Core.view(g,pid); },
  async vapidKey(){ return null; },
  async subscribe(){ return {ok:false,reason:"local_mode"}; }
};

const ServerBackend = {
  mode:"server",
  async _post(path,body){ const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); if(!r.ok) throw new Error(await r.text()); return r.json(); },
  async create(name,names){ return this._post("/api/create",{name,names}); },
  async exists(code){ const r=await fetch("/api/exists?code="+encodeURIComponent(code)); const j=await r.json(); return j.exists; },
  async claim(code,pid){ return this._post("/api/claim",{code,pid}); },
  async state(code,pid){ const r=await fetch("/api/state?code="+encodeURIComponent(code)+"&pid="+encodeURIComponent(pid)); if(!r.ok) return null; return r.json(); },
  async act(code,pid,action,payload){ return this._post("/api/act",{code,pid,action,payload}); },
  async vapidKey(){ try{ const r=await fetch("/api/vapidPublicKey"); const j=await r.json(); return j.key; }catch(e){ return null; } },
  async subscribe(code,pid,subscription){ return this._post("/api/subscribe",{code,pid,subscription}); }
};

/* ローカル・サーバー共通のアクション適用 */
function applyAction(g,pid,action,payload){
  const me = g.players.find(p=>p.id===pid);
  if(action==="seenRole" && me){ me.seenRole=true; }
  else if(action==="order"){
    if(!me || me.role!=="wolf") return;
    if(!payload.toId || !String(payload.text||"").trim()) return;
    Core.sendOrder(g, pid, payload.toId, String(payload.text).slice(0,400));
  }
  else if(action==="read"){
    (g.orders.find(o=>o.id===payload.id&&o.toId===pid)||{}).read=true;
    (g.ambient.find(a=>a.id===payload.id&&a.toId===pid)||{}).read=true;
  }
  else if(action==="log"){
    const txt=String(payload.text||"").trim().slice(0,600);
    const photo=(typeof payload.photo==="string" && payload.photo.startsWith("data:image/")) ? payload.photo : null;
    const allowedKinds=["free","photo","tanka","poem","mood","wolf_theory"];
    const kind = allowedKinds.includes(payload.kind) ? payload.kind : "free";
    let mood=null;
    if(kind==="mood"){ const m=parseInt(payload.mood,10); if(m>=1&&m<=5) mood=m; }
    if(!txt && !photo && !mood) return;
    const t=nowMs();
    const delay=Math.floor(Math.random()*(MAX_LOG_DELAY_MS+1));  // 0分〜3分
    g.logs.push({id:uid(), playerId:pid, kind, text:txt, photo, mood, at:t, deliverAt:t+delay});
  }
  else if(action==="openVote"){ if(g.phase==="playing") g.phase="voting"; }
  else if(action==="vote"){
    if(g.phase!=="voting") return;
    const v=(payload.picks||[]).slice(0,2);
    if(v.length===2) g.votes[pid]=v;
  }
  else if(action==="missionComplete"){
    const sm=(g.secretMissions||[]).find(m=>m.toId===pid && m.deliverAt<=nowMs());
    if(!sm || sm.completed) return;
    sm.completed=true;
    const others=g.players.filter(p=>p.id!==pid);
    if(others.length){
      const target=others[rnd(0,others.length-1)];
      sm.rewardPlayerId=target.id; sm.rewardRole=target.role;
    }
  }
  else if(action==="reveal"){ g.phase="result"; g.revealedAt=nowMs(); }
  else if(action==="backToPlay"){ if(g.phase==="voting"){ g.phase="playing"; } }
}

/* ===================== アプリ状態 ===================== */
let B = LocalBackend;
const A = { view:"home", code:null, pid:null, st:null, tab:"home", sel:[], toast:null, openSlip:null, localPlayers:[], pendingPhoto:null, logKind:"free", logMood:null };

const KIND_META = {
  free:        { label:null,    placeholder:"今日の出来事、食べたもの、誰かの名言など" },
  photo:       { label:"写真",   placeholder:"気になったことがあれば添えて（任意）" },
  tanka:       { label:"短歌",   placeholder:"五・七・五・七・七で、今の気持ちを詠んでみてください" },
  poem:        { label:"ポエム", placeholder:"自由に一篇、書いてみてください" },
  mood:        { label:"気分",   placeholder:"ひとことあれば（任意）" },
  wolf_theory: { label:"推理",   placeholder:"今、誰が怪しい？ 理由も自由に書いてみてください" }
};
const KIND_CHIPS = [
  {k:"free", label:"📝 その他"}, {k:"photo", label:"📷 写真"}, {k:"tanka", label:"🌸 短歌"},
  {k:"poem", label:"✒️ ポエム"}, {k:"mood", label:"🙂 気分"}, {k:"wolf_theory", label:"🔍 推理"}

/* 選んだ写真を、送信に耐えるサイズまで縮小・圧縮してdataURLにする */
function resizeImage(file, maxW){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.max(1, Math.round(img.width*scale)), hgt = Math.max(1, Math.round(img.height*scale));
        const canvas = document.createElement("canvas");
        canvas.width=w; canvas.height=hgt;
        canvas.getContext("2d").drawImage(img,0,0,w,hgt);
        resolve(canvas.toDataURL("image/jpeg",0.72));
      };
      img.onerror = ()=>reject(new Error("image_decode_failed"));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error("read_failed"));
    reader.readAsDataURL(file);
  });
}

function toast(msg){ A.toast=msg; render(); setTimeout(()=>{ if(A.toast===msg){A.toast=null; render();} },2200); }
async function refresh(){
  if(!A.code||!A.pid) return;
  try{ const st = await B.state(A.code,A.pid); if(st){ A.st=st; } }catch(e){}
}
async function act(action,payload){
  try{ const st = await B.act(A.code,A.pid,action,payload||{}); if(st) A.st=st; }catch(e){ toast("通信に失敗しました"); }
  render();
}
function urlBase64ToUint8Array(base64String){
  const padding="=".repeat((4 - base64String.length % 4) % 4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64); const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
async function enablePush(){
  if(B.mode!=="server") return toast("この体験版では通知は使えません");
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("この端末・ブラウザは通知に対応していません");
  try{
    const key = await B.vapidKey();
    if(!key) return toast("サーバー側で通知の準備ができていません（npm install web-push）");
    const perm = await Notification.requestPermission();
    if(perm!=="granted") return toast("通知が許可されませんでした");
    const reg = await navigator.serviceWorker.register("/sw.js");
    const ready = await navigator.serviceWorker.ready;
    let sub = await ready.pushManager.getSubscription();
    if(!sub) sub = await ready.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(key) });
    await B.subscribe(A.code, A.pid, sub);
    toast("通知を有効にしました");
    await refresh(); render();
  }catch(e){ toast("通知の設定に失敗しました"); }
}

  if(A.view==="home") return viewHome();

  if(A.view==="join") return viewJoin();
  if(A.view==="pick") return viewPick();
  if(A.st && !A.st.me){ A.view="pick"; return viewPick(); }
  if(!A.st) return h(`<div class="center sub" style="padding:80px 0">読み込み中…</div>`);
  if(A.st.phase!=="result" && A.st.me && !A.st.me.seenRole) return viewRole();

  if(A.view==="inbox") return viewInbox();
  if(A.view==="order") return viewOrder();
  if(A.view==="log") return viewLog();
  if(A.view==="vote") return viewVote();
  if(A.view==="result") return viewResult();
  return viewPlayerHome();
}

  if(v==="home"){ A.view = (A.st && A.st.me) ? "home2" : "home"; }

}

function bind(){
  document.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>nav(el.getAttribute("data-nav")));
  document.querySelectorAll("[data-claim]").forEach(el=>el.onclick=()=>doClaim(el.getAttribute("data-claim")));
  document.querySelectorAll("[data-read]").forEach(el=>el.onclick=()=>act("read",{id:el.getAttribute("data-read")}));
  document.querySelectorAll("[data-pick1]").forEach(el=>el.onclick=()=>{ A.sel=[el.getAttribute("data-pick1")]; const t=document.getElementById("otext"); const keep=t?t.value:""; render(); const t2=document.getElementById("otext"); if(t2) t2.value=keep; });
  document.querySelectorAll("[data-pick2]").forEach(el=>el.onclick=()=>{ const id=el.getAttribute("data-pick2");
    A.sel = A.sel.includes(id) ? A.sel.filter(x=>x!==id) : (A.sel.length<2?[...A.sel,id]:A.sel); render(); });
  document.querySelectorAll("[data-logkind]").forEach(el=>el.onclick=()=>{
    const t=document.getElementById("ltext"); const keep=t?t.value:"";
    A.logKind=el.getAttribute("data-logkind"); if(A.logKind!=="mood") A.logMood=null;
    render();
    const t2=document.getElementById("ltext"); if(t2) t2.value=keep;
  });
  document.querySelectorAll("[data-mood]").forEach(el=>el.onclick=()=>{
    const t=document.getElementById("ltext"); const keep=t?t.value:"";
    A.logMood=parseInt(el.getAttribute("data-mood"),10);
    render();
    const t2=document.getElementById("ltext"); if(t2) t2.value=keep;
  });
  const lphoto=document.getElementById("lphoto");
  if(lphoto) lphoto.onchange=async()=>{
    const f=lphoto.files[0]; if(!f) return;
    const prev=document.getElementById("lphotoPreview");
    if(prev) prev.innerHTML=`<span class="sub">写真を読み込んでいます…</span>`;
    try{
      A.pendingPhoto = await resizeImage(f, 1000);
      const prev2=document.getElementById("lphotoPreview");
      if(prev2) prev2.innerHTML=`<div class="row"><img src="${A.pendingPhoto}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px"><span class="sub grow">この写真を記録します</span><button class="btn ghost sm" data-act="photoclear" style="width:auto;padding:8px 12px">取り消す</button></div>`;
      bind();
    }catch(e){ toast("写真の読み込みに失敗しました"); }
  };
  const sw=document.getElementById("swsel");
  if(sw) sw.onchange=async()=>{ A.pid=sw.value; A.view="home2"; saveSession(); await refresh(); render(); };
  document.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>doAct(el.getAttribute("data-act")));
}

async function doAct(a){
  if(a.startsWith("go:")) return nav(a.slice(3));
  if(a==="resume"){ const s=LS.get("sjw:session",null); if(s){ A.code=s.code; A.pid=s.pid; await refresh(); if(!A.st||!A.st.me){ A.code=null;A.pid=null;A.view="home"; toast("前回のゲームが見つかりません"); } else A.view="home2"; render(); } return; }
  if(a==="create"){
    const name=document.getElementById("gname").value.trim();
    const names=[...document.querySelectorAll(".pname")].map(i=>i.value.trim());
    if(names.some(n=>!n)) return toast("7人分の名前を入れてください");
    LS.set("sjw:names",names); LS.set("sjw:gname",name);
    const {code}=await B.create(name,names);
    A.code=code; A.st=null;
    if(B.mode==="local"){ A.localPlayers=names.map((n,i)=>({id:"p"+(i+1),name:n,claimed:false})); }
    else { A.st=await B.state(code,"?"); A.localPlayers=A.st?A.st.players:[]; }
    A.view="pick"; render(); return;
  }
  if(a==="join"){
    const code=document.getElementById("jcode").value.trim();
    if(!/^\d{6}$/.test(code)) return toast("6桁の数字を入れてください");
    if(!(await B.exists(code))) return toast("そのゲームが見つかりません");
    A.code=code; const st=await B.state(code,"?"); A.localPlayers=st?st.players:[];
    A.view="pick"; render(); return;
  }
  if(a==="roleshow"){ A.openSlip="role"; return render(); }
  if(a==="rolehide"){ A.openSlip=null; return render(); }
  if(a==="roleok"){ A.openSlip=null; A.view="home2"; return act("seenRole"); }
  if(a==="send"){
    const t=document.getElementById("otext").value.trim();
    if(!A.sel[0]) return toast("送る相手を選んでください");
    if(!t) return toast("指示の内容を入れてください");
    await act("order",{toId:A.sel[0],text:t});
    A.sel=[]; A.view="home2"; render(); toast("指示を送信しました"); return;
  }
  if(a==="enablepush"){ return enablePush(); }
  if(a==="missionclear"){
    if(confirm("このミッションをクリアしましたか？")){ await act("missionComplete"); toast("MISSION CLEAR！"); }
    return;
  }
  if(a==="photoclear"){
    A.pendingPhoto=null;
    const el=document.getElementById("lphoto"); if(el) el.value="";
    const prev=document.getElementById("lphotoPreview"); if(prev) prev.innerHTML="";
    return;
  }
  if(a==="log"){
    const kind=A.logKind||"free";
    const t=document.getElementById("ltext").value.trim();
    const mood=A.logMood;
    if(kind==="mood" && !mood) return toast("気分を選んでください");
    if(!t && !A.pendingPhoto && !(kind==="mood"&&mood)) return toast("内容か写真を入れてください");
    await act("log",{text:t, photo:A.pendingPhoto||null, kind, mood});
    A.pendingPhoto=null; A.logKind="free"; A.logMood=null; render(); toast("保存しました"); return;
  }
  if(a==="openvote"){ if(confirm("全員の画面を最終投票に切り替えます。よろしいですか？")) await act("openVote"); return; }
  if(a==="vote"){ if(A.sel.length!==2) return; await act("vote",{picks:A.sel}); A.sel=[]; toast("投票しました"); return; }
  if(a==="reveal"){ if(confirm("全員の役職と、すべての指示を公開します。よろしいですか？")){ await act("reveal"); A.view="result"; render(); } return; }
}

async function doClaim(pid){
  const r=await B.claim(A.code,pid);
  if(!r) return toast("参加できませんでした");
  A.pid=pid; saveSession(); await refresh(); A.view="home2"; A.openSlip=null; render();
}

/* ===================== 起動 ===================== */
(async function boot(){
  try{
    const r=await fetch("/api/ping",{cache:"no-store"});
    if(r.ok && (await r.json()).ok) B=ServerBackend;
  }catch(e){}
  const p=new URLSearchParams(location.search);
  if(p.get("g")){ A.code=p.get("g"); const st=await B.state(A.code,"?"); if(st){ A.localPlayers=st.players; A.view="pick"; } }
  render();
  setInterval(async()=>{
    if(!A.code||!A.pid) return;
    const before = A.st ? A.st.inbox.filter(i=>!i.read).length : 0;
    const hadMission = A.st ? !!A.st.secretMission : false;
    await refresh();
    const after = unread();
    const hasMission = A.st ? !!A.st.secretMission : false;
    if(after>before && A.view!=="inbox"){ if(navigator.vibrate) navigator.vibrate(120); }
    if(hasMission && !hadMission){ if(navigator.vibrate) navigator.vibrate([90,60,90,60,90]); toast("🎯 シークレットミッションが届きました"); }
    const typing = document.activeElement && ["INPUT","TEXTAREA"].includes(document.activeElement.tagName);
    if(!typing && ["home2","inbox","log","vote","result"].includes(A.view)) render();
    document.title = (after>0?`(${after}) `:"")+"指示人狼";
  },POLL_MS);
})();
</script>
